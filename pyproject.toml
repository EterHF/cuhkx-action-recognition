[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuhkx-strict-v3"
version = "1.0.0"
description = "Reproducible strictV3 baseline for the CUHK-X Small Model Track"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy",
  "pandas",
  "Pillow",
  "torch",
  "torchvision",
  "ultralytics",
]

[project.scripts]
cuhkx-verify = "yolo_r2plus1d.strict_v3.release.verify:main"
cuhkx-replay = "yolo_r2plus1d.strict_v3.release.replay:main"
cuhkx-audit-experiments = "yolo_r2plus1d.experiments.audit:main"

[tool.setuptools.packages.find]
include = ["yolo_r2plus1d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
