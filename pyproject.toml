[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuhkx-strict-v3"
version = "1.0.0"
description = "Reproducible strictV3 baseline for the CUHK-X Small Model Track"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy",
  "pandas",
  "Pillow",
  "scikit-learn",
  "torch",
  "torchvision",
  "ultralytics",
]

[project.optional-dependencies]
public-backbones = [
  "einops>=0.8,<0.9",
  "gdown>=5.2,<6",
  "hydra-core>=1.3,<1.4",
  "iopath>=0.1,<0.2",
  "mmcv-lite>=2.0,<2.2",
  "mmengine>=0.10,<0.11",
  "opencv-python>=4.10",
  "timm>=1.0,<1.1",
]

[project.scripts]
cuhkx-verify = "yolo_r2plus1d.strict_v3.release.verify:main"
cuhkx-replay = "yolo_r2plus1d.strict_v3.release.replay:main"
cuhkx-build-bundle = "yolo_r2plus1d.strict_v3.release.bundle:main"
cuhkx-audit-experiments = "yolo_r2plus1d.experiments.audit:main"
cuhkx-train-temporal = "yolo_r2plus1d.strict_v3.training.temporal_suite:main"

[tool.setuptools.packages.find]
include = ["yolo_r2plus1d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
